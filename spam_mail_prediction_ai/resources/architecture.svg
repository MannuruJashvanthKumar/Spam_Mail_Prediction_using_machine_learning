<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="460" viewBox="0 0 1400 460">
<defs>
  <linearGradient id="g1" x1="0" x2="1"><stop offset="0" stop-color="#181b3a"/><stop offset="1" stop-color="#635bff"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-opacity="0.10"/></filter>
</defs>
<rect width="1400" height="460" rx="28" fill="#f5f7fb"/>
<text x="70" y="65" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#172033">MailGuard AI — ML Pipeline</text>
<text x="70" y="96" font-family="Arial, sans-serif" font-size="16" fill="#687386">From raw message text to a spam / ham prediction</text>

<g filter="url(#shadow)">
<rect x="70" y="155" width="220" height="145" rx="20" fill="white" stroke="#e7ebf2"/>
<rect x="330" y="155" width="220" height="145" rx="20" fill="white" stroke="#e7ebf2"/>
<rect x="590" y="155" width="220" height="145" rx="20" fill="white" stroke="#e7ebf2"/>
<rect x="850" y="155" width="220" height="145" rx="20" fill="white" stroke="#e7ebf2"/>
<rect x="1110" y="155" width="220" height="145" rx="20" fill="url(#g1)"/>
</g>

<g font-family="Arial, sans-serif">
<text x="180" y="195" text-anchor="middle" font-size="19" font-weight="700" fill="#172033">1. Message</text>
<text x="180" y="225" text-anchor="middle" font-size="14" fill="#687386">Raw email / SMS text</text>
<text x="180" y="250" text-anchor="middle" font-size="14" fill="#687386">from the user</text>

<text x="440" y="195" text-anchor="middle" font-size="19" font-weight="700" fill="#172033">2. TF-IDF</text>
<text x="440" y="225" text-anchor="middle" font-size="14" fill="#687386">Text → sparse</text>
<text x="440" y="250" text-anchor="middle" font-size="14" fill="#687386">numeric features</text>

<text x="700" y="195" text-anchor="middle" font-size="19" font-weight="700" fill="#172033">3. Logistic Regression</text>
<text x="700" y="225" text-anchor="middle" font-size="14" fill="#687386">Learns class</text>
<text x="700" y="250" text-anchor="middle" font-size="14" fill="#687386">decision boundary</text>

<text x="960" y="195" text-anchor="middle" font-size="19" font-weight="700" fill="#172033">4. Probabilities</text>
<text x="960" y="225" text-anchor="middle" font-size="14" fill="#687386">Spam vs. ham</text>
<text x="960" y="250" text-anchor="middle" font-size="14" fill="#687386">class estimates</text>

<text x="1220" y="195" text-anchor="middle" font-size="19" font-weight="700" fill="white">5. Result</text>
<text x="1220" y="225" text-anchor="middle" font-size="14" fill="#eef0ff">SPAM / HAM</text>
<text x="1220" y="250" text-anchor="middle" font-size="14" fill="#eef0ff">with explanation</text>
</g>

<g stroke="#9aa4b7" stroke-width="3" fill="none" stroke-linecap="round">
<path d="M290 228 H330"/><path d="M550 228 H590"/><path d="M810 228 H850"/><path d="M1070 228 H1110"/>
</g>
<g fill="#9aa4b7">
<path d="M323 220 L333 228 L323 236 Z"/><path d="M583 220 L593 228 L583 236 Z"/><path d="M843 220 L853 228 L843 236 Z"/><path d="M1103 220 L1113 228 L1103 236 Z"/>
</g>
</svg>